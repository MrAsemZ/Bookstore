<body>
    <script>
        let number = prompt ("Please Enter Any Number in the Range of 0-100");
  
        while (isNaN(number) || number < 0 || number > 100){ // used || with NaN to redirect him to enter a number in range
        number = prompt("The Number you entered is out of range! Enter a number between 0-100 !!");
    }
    
    </script>
</body>
