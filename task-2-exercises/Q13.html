<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q13</title>
</head>
<body>
    <script>
        let number = prompt ("Please Enter Any Integer Number: ");
        let sum = 0;
        let numCount = 0;
        for (let i = 0; i <= number; i++){
            sum += i;
            numCount += 1;
        }
        let average = sum / numCount;


        alert(number + ", And the sum is: " + sum + ", The Average is: " + average);
        console.log(number + ", And the sum is: " + sum);
    </script>
</body>
</html>
