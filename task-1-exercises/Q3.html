<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3</title>
</head>
<body>
    <script>
     let userNumber1 = prompt("Enter a number:");
     let userNumber2 = prompt("Enter another number:");

     if(userNumber1 > userNumber2){
        alert("The numbers in ascending order: " + userNumber2 + ", " + userNumber1);
     }
     else if(userNumber2 > userNumber1){
        alert("The numbers in ascending order: " + userNumber1 + ", " + userNumber2);
     }
     else{
        alert("The numbers are Equal!!");
     }
    </script>
</body>
</html>
